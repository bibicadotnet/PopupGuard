name: Release Packer

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Package and Upload
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get repository name
          REPO_NAME=$(basename "${{ github.repository }}")

          # ZIP filename = Repository name
          ZIP_NAME="${REPO_NAME}.zip"

          # Read version from manifest.json
          VERSION=$(jq -r '.version' manifest.json)

          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "Cannot read version from manifest.json"
            exit 1
          fi

          TAG_NAME="v$VERSION"

          echo "Repository : $REPO_NAME"
          echo "ZIP Name   : $ZIP_NAME"
          echo "Version    : $VERSION"
          echo "Tag        : $TAG_NAME"

          # Create release if not exists
          gh release view "$TAG_NAME" > /dev/null 2>&1 || \
          gh release create "$TAG_NAME" \
            --title "$TAG_NAME" \
            --generate-notes

          # Create ZIP package
          zip -r "$ZIP_NAME" . \
            -x "*.git*" \
               ".github/*" \
               "LICENSE" \
               "*.md"

          # Upload asset
          gh release upload "$TAG_NAME" "$ZIP_NAME" --clobber

          # Latest download URL
          echo "Download URL:"
          echo "https://github.com/${{ github.repository }}/releases/latest/download/$ZIP_NAME"

      - name: Update latest branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Read version from manifest.json
          VERSION=$(jq -r '.version' manifest.json)
          TAG_NAME="v$VERSION"

          git fetch --tags

          git checkout latest 2>/dev/null || git checkout -b latest
          git reset --hard "$TAG_NAME"
          git push origin latest --force
